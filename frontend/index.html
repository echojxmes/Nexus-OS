<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nexus-frame">
    <header class="nexus-header">
      <span class="nexus-title">NEXUS</span>
      <span id="clock" class="nexus-clock">--:--:--</span>
    </header>

    <main class="nexus-grid">
      <div class="card">
        <div class="card-label">CPU</div>
        <div class="card-value" id="cpu">--%</div>
      </div>
      <div class="card">
        <div class="card-label">MEMORY</div>
        <div class="card-value" id="memory">--%</div>
      </div>
      <div class="card">
        <div class="card-label">STORAGE</div>
        <div class="card-value" id="storage">--%</div>
      </div>
      <div class="card">
        <div class="card-label">NETWORK</div>
        <div class="card-value" id="network">--</div>
      </div>
      <div class="card">
        <div class="card-label">UPTIME</div>
        <div class="card-value" id="uptime">--</div>
      </div>
      <div class="card" id="env-card" style="display:none;">
        <div class="card-label">ROOM</div>
        <div class="card-value" id="env-temp">--°C</div>
        <div class="card-sub" id="env-humidity">--% HUMIDITY</div>
      </div>
    </main>

    <section id="lighting-panel" class="lighting-panel" style="display:none;">
      <button class="led-btn" id="led-off" data-mode="OFF">OFF</button>
      <button class="led-btn" id="led-white" data-mode="WHITE">WHITE</button>
      <button class="led-btn" id="led-blue" data-mode="BLUE">BLUE</button>
      <button class="led-btn" id="led-purple" data-mode="PURPLE">PURPLE</button>
      <button class="led-btn" id="led-nexus" data-mode="NEXUS">NEXUS</button>
      <button class="led-btn" id="led-rainbow" data-mode="RAINBOW">RAINBOW</button>
    </section>

    <footer class="nexus-status">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">CONNECTING</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
